name: Files check

# Automatic and light: nothing is run, DuckDB is not installed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Scripts compile, README links and images exist, raw CSV header is as expected
        run: python scripts/check_repo.py
